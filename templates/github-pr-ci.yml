# github-pr-ci.yml
# Copy into a project and replace the project-gate placeholder with that
# project's direct compiler or test command. No language runtime is implied by this template.
name: Project quality

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: quality / required
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fail closed while the project gate is missing
        shell: bash
        run: |
          marker='__PROJECT'
          marker="${marker}_GATE__"
          ! grep -qF "$marker" .github/workflows/pr-quality.yml || {
            echo 'Replace the project-gate placeholder with the project test or compiler command.' >&2
            exit 1
          }

      - name: Run the project gate
        shell: bash
        run: __PROJECT_GATE__

      - name: Check changed lines
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          zero_sha=0000000000000000000000000000000000000000
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$BASE_SHA...$GITHUB_SHA"
          elif [[ -n "${GITHUB_EVENT_BEFORE:-}" && "$GITHUB_EVENT_BEFORE" != "$zero_sha" ]]; then
            git diff --check "$GITHUB_EVENT_BEFORE" "$GITHUB_SHA"
          else
            git diff --check "$GITHUB_SHA^" "$GITHUB_SHA"
          fi

      - name: Check the PR body structure
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          for heading in '## Summary' '## Why' '## Verification' '## Risks'; do
            grep -qF "$heading" <<<"$PR_BODY" || { echo "missing section: $heading"; exit 1; }
          done
