# Focused repository checks for universal-template.
# Runs the executable helpers this repository ships and checks whitespace.
# The required-check API is the job name: quality / required.
name: Project quality

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: quality / required
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install pinned Bend in the temporary runner directory
        shell: bash
        run: |
          set -euo pipefail
          bash knowledge/playbooks/math-schema/bend/tools/install-linux-x64.sh "$RUNNER_TEMP/bend-toolchain"
          echo "$RUNNER_TEMP/bend-toolchain/bend/bin" >> "$GITHUB_PATH"

      - name: Test published helpers
        shell: bash
        run: |
          set -euo pipefail
          python3 knowledge/playbooks/pencil/scripts/test-verify-fidelity-manifest.py
          node --test knowledge/playbooks/cdp/sdk/*.test.ts

      - name: Verify first-party mathematical certificates and behavior
        shell: bash
        env:
          BEND_NO_TELEMETRY: '1'
        run: |
          set -euo pipefail
          python3 knowledge/playbooks/math-schema/bend/check.py
          python3 -m unittest discover -s knowledge/playbooks/math-schema/bend/tests -v

      - name: Check changed lines
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          zero_sha=0000000000000000000000000000000000000000
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$BASE_SHA...$GITHUB_SHA"
          elif [[ -n "${GITHUB_EVENT_BEFORE:-}" && "$GITHUB_EVENT_BEFORE" != "$zero_sha" ]] \
            && git cat-file -e "${GITHUB_EVENT_BEFORE}^{commit}" 2>/dev/null; then
            # A force-push discards the recorded "before" commit, so it is not
            # reachable from any ref and checkout cannot fetch it. Fall back to
            # the pushed commit's own parent instead of failing on a bad object.
            git diff --check "$GITHUB_EVENT_BEFORE" "$GITHUB_SHA"
          else
            git diff --check "$GITHUB_SHA^" "$GITHUB_SHA"
          fi
