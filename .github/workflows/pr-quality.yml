# Focused repository checks for universal-template.
# The required-check API is the job name: quality / required.
name: Project quality

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: quality / required
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Test published helpers
        shell: bash
        run: |
          set -euo pipefail
          {
            python3 knowledge/playbooks/pencil/scripts/test-verify-fidelity-manifest.py
            node --test knowledge/playbooks/cdp/sdk/recording-privacy.test.ts
            python3 scripts/pr-metadata.py --selftest
          } 2>&1 | tee /tmp/repository-contracts.log

      - name: Check changed lines
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          zero_sha=0000000000000000000000000000000000000000
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$BASE_SHA...$GITHUB_SHA"
          elif [[ -n "${GITHUB_EVENT_BEFORE:-}" && "$GITHUB_EVENT_BEFORE" != "$zero_sha" ]] \
            && git cat-file -e "${GITHUB_EVENT_BEFORE}^{commit}" 2>/dev/null; then
            # A force-push discards the recorded "before" commit, so it is not
            # reachable from any ref and checkout cannot fetch it. Fall back to
            # the pushed commit's own parent instead of failing on a bad object.
            git diff --check "$GITHUB_EVENT_BEFORE" "$GITHUB_SHA"
          else
            git diff --check "$GITHUB_SHA^" "$GITHUB_SHA"
          fi

      - name: Check the PR body contract
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          test "${#PR_BODY}" -ge 30
          for heading in '## Summary' '## Why' '## Verification' '## Risks'; do
            grep -qF "$heading" <<<"$PR_BODY" || { echo "missing section: $heading"; exit 1; }
          done
          for placeholder in TODO TBD; do
            ! grep -qF "$placeholder" <<<"$PR_BODY" || { echo "placeholder remains: $placeholder"; exit 1; }
          done

      - name: Upload contract log on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repository-contracts
          path: /tmp/repository-contracts.log
          retention-days: 2
