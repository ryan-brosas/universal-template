# Objective publication contracts for universal-template.
# The required-check API is the job name: quality / required.
name: Project quality

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: quality / required
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install structured-data checker
        run: pip install --user -r requirements-dev.txt

      - name: Check repository contracts
        shell: bash
        run: |
          set -euo pipefail
          {
            SKILLS_ROOT="$GITHUB_WORKSPACE/skills" python3 scripts/skill-validator.py
            python3 scripts/skill-validator.py --selftest
            python3 scripts/install-prompts.py --check-repo
            python3 scripts/install-prompts.py --selftest
            python3 scripts/render-prompt.py --selftest
            python3 scripts/skill-catalog.py selftest
            python3 scripts/skill-catalog.py fixture-test
            python3 scripts/skill-catalog.py context
            python3 scripts/skill-catalog.py generate --check
            python3 scripts/repo-hygiene.py --selftest
            python3 scripts/repo-hygiene.py
            python3 scripts/repo-hygiene.py --fixture-test
            python3 mcp/configure.py --selftest
            node --test skills/cdp/sdk/recording-privacy.test.ts
            python3 scripts/web-reference-manifest.py --selftest
            python3 scripts/pr-metadata.py --selftest
          } 2>&1 | tee /tmp/repository-contracts.log

      - name: Check changed lines
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          zero_sha=0000000000000000000000000000000000000000
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$BASE_SHA...$GITHUB_SHA"
          elif [[ -n "${GITHUB_EVENT_BEFORE:-}" && "$GITHUB_EVENT_BEFORE" != "$zero_sha" ]]; then
            git diff --check "$GITHUB_EVENT_BEFORE" "$GITHUB_SHA"
          else
            git diff --check "$GITHUB_SHA^" "$GITHUB_SHA"
          fi

      - name: Check the PR body contract
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          test "${#PR_BODY}" -ge 30
          for heading in '## Summary' '## Why' '## Verification' '## Risks'; do
            grep -qF "$heading" <<<"$PR_BODY" || { echo "missing section: $heading"; exit 1; }
          done
          for placeholder in TODO TBD; do
            ! grep -qF "$placeholder" <<<"$PR_BODY" || { echo "placeholder remains: $placeholder"; exit 1; }
          done

      - name: Upload contract log on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repository-contracts
          path: /tmp/repository-contracts.log
          retention-days: 2
