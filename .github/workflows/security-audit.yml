# Audits GitHub Actions workflows for insecure patterns with zizmor
# (dangerous triggers, untrusted-input injection). Path-filtered by design:
# it runs only when workflows change, so it is intentionally NOT a required
# status check (required checks must have unconditional trigger semantics).

name: security-audit

on:
  push:
    paths:
      - '.github/workflows/**'
  pull_request:
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install zizmor
        run: pip install --user zizmor==1.29.0  # pinned; bump deliberately

      - name: Audit workflows
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          zizmor .github/workflows/ 2>&1 | tee /tmp/zizmor.log

      - name: Upload audit log on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zizmor-audit
          path: /tmp/zizmor.log
          retention-days: 2
