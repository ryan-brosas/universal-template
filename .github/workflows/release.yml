# Publish a GitHub release for a pushed vX.Y.Z tag.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Install structured-data checker
        run: pip install --user pyyaml==6.0.3

      - name: Check repository contracts
        shell: bash
        run: |
          set -euo pipefail
          SKILLS_ROOT="$GITHUB_WORKSPACE/skills" python3 scripts/skill-validator.py
          python3 scripts/install-prompts.py --check-repo
          python3 scripts/install-prompts.py --selftest
          python3 scripts/render-prompt.py --selftest
          python3 scripts/skill-catalog.py generate --check
          python3 scripts/repo-hygiene.py
          python3 scripts/web-reference-manifest.py --selftest
          python3 scripts/pr-metadata.py --selftest
          git diff --check "$GITHUB_SHA^" "$GITHUB_SHA"

  publish:
    name: publish release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish the release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          gh release view "$GITHUB_REF_NAME" --json url,name,isDraft --jq '{url, name, isDraft}'
