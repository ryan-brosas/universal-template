# Publish a GitHub release for a pushed vX.Y.Z tag.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Test published helpers
        shell: bash
        run: |
          set -euo pipefail
          python3 knowledge/playbooks/pencil/scripts/test-verify-fidelity-manifest.py
          node --test knowledge/playbooks/cdp/sdk/recording-privacy.test.ts
          git diff --check "$GITHUB_SHA^" "$GITHUB_SHA"

  publish:
    name: publish release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish the release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          gh release view "$GITHUB_REF_NAME" --json url,name,isDraft --jq '{url, name, isDraft}'
