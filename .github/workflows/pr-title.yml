# Validates PR titles against the conventional-commit contract via the shared
# parser (scripts/pr-metadata.py): the same grammar and strictness that derives
# type/breaking-change labels and the .github/release.yml categories. PR titles
# feed the changelog through that label chain.

name: pr-title

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "PR title: $TITLE"
          python3 scripts/pr-metadata.py validate --title "$TITLE"
