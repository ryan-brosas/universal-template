# Portable task-needs profiles. These are requirements, not model rankings.
# Machine-local model preferences belong in config/model-profiles.local.yaml,
# which is git-ignored. Resolve concrete models from live host inventory.
profiles:
  economy-worker:
    needs:
      reasoning: routine
      latency: low
      cost: low
      tools: [filesystem]
  fast-investigator:
    needs:
      reasoning: moderate
      latency: low
      tools: [filesystem, search]
  strong-reviewer:
    needs:
      reasoning: high
      context: large
      tools: [filesystem]
  architect:
    needs:
      reasoning: high
      context: large
      output: structured-design
  frontend-critic:
    needs:
      reasoning: moderate
      modalities: [image-input]
      tools: [browser]
  debugger:
    needs:
      reasoning: high
      tools: [filesystem, execution]
  spam-worker:
    needs:
      reasoning: routine
      latency: low
      cost: lowest
