# Model profiles — LOCAL PREFERENCES, not facts.
#
# Resolve every entry against runtime discovery before use:
#   pi --list-models | veda models [backend] | agy models
#   python3 ~/.agents/scripts/runtime-capabilities.py
#
# Addressing: <backend>:<model>. Pi models keep their provider form
# (<backend>:<provider>/<model>); through Veda the pi backend expects the
# full pi/<provider>/<model> string (runtime-verified).
#
# Observed 2026-08-30 (veda 0.75.9, pi 0.84.4, agy 2026.2) — re-verify:
#   - agy Gemini lanes work via veda and via direct `agy -p`.
#   - agy Claude models (claude-sonnet-4-6, claude-opus-4-6-thinking) reject
#     --effort at any level (fixed-thinking); direct
#     `agy --model <model> -p ...` works; the veda lane injects effort and
#     currently fails — fall back to direct agy, re-verify on veda upgrades.
#   - claude-code backend installed but unauthenticated (/login required).
#   - github-copilot: auth-reported ready but functionally broken — removed
#     from all chains (observed 2026-08-30); re-add only after it works.
#   - yolo-auto/qwen3.8-27b: spam-safe lane (owner-approved, no rate concern).
#   - pi provider readiness is environment-scoped — check per lane.
#   - Catalog context columns are base-tier values: an active Pro
#     subscription can raise the effective window (owner-confirmed 256K on
#     yolo-auto/qwen3.8-27b vs 131.1K listed). Owner-confirmed effective
#     limits override catalog numbers for context budgeting.

profiles:
  economy-worker:
    prefer:
      - pi:zro/deepseek-v4-flash-0731        # configured Main model
      - pi:hyper/deepseek-v4-flash           # 1M context
      - agy:gemini-3.7-flash-low
  fast-investigator:
    prefer:
      - pi:hyper/deepseek-v4-flash
      - agy:gemini-3.7-flash-medium
  strong-reviewer:
    prefer:
      - agy:claude-opus-4-6-thinking         # direct agy only (no --effort)
      - agy:claude-sonnet-4-6                # direct agy only
      - pi:cursor/claude-opus-5@1m           # listed in pi catalog; auth unverified
      - claude-code:opus                     # pending /login
  architect:
    prefer:
      - agy:claude-opus-4-6-thinking         # direct agy only
      - pi:cursor/claude-opus-5@1m           # listed in pi catalog; auth unverified
  frontend-critic:
    prefer:
      - agy:gemini-3.1-pro-high              # alias: gemini-pro
      - agy:gemini-3.7-flash-high            # alias: gemini-ui
      - agy:claude-sonnet-4-6                # direct agy; strong alternate UI critic
  debugger:
    prefer:
      - pi:hyper/deepseek-v4-pro
      - agy:claude-sonnet-4-6
  spam-worker:
    prefer:
      - pi:yolo-auto/qwen3.8-27b             # owner-approved spam lane; 256K effective ctx (Pro subs; catalog lists 131.1K), thinking + images
