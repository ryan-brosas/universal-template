# Model profiles — STABLE LOCAL PREFERENCES only (git-tracked).
#
# This file holds which models are PREFERRED per lane. It never records
# runtime state: no auth status, no dated quirks, no availability — that is
# discovered live by scripts/resolve-model.py and scripts/runtime-capabilities.py,
# or recorded in dated files under audits/.
#
# Resolve every entry against runtime discovery before use:
#   python3 ~/.agents/scripts/resolve-model.py --role <role> --json
#   python3 ~/.agents/scripts/runtime-capabilities.py
#   pi --list-models | veda models [backend] | agy models
#
# Addressing: <backend>:<model>. Pi models keep their provider form
# (<backend>:<provider>/<model>); through the Veda pi backend the expected
# string is pi/<provider>/<model>.

profiles:
  economy-worker:
    prefer:
      - pi:zro/deepseek-v4-flash-0731        # configured Main model
      - pi:hyper/deepseek-v4-flash           # large context
      - agy:gemini-3.7-flash-low
  fast-investigator:
    prefer:
      - pi:hyper/deepseek-v4-flash
      - agy:gemini-3.7-flash-medium
  strong-reviewer:
    prefer:
      - agy:claude-opus-4-6-thinking
      - agy:claude-sonnet-4-6
      - pi:cursor/claude-opus-5@1m
      - claude-code:opus
  architect:
    prefer:
      - agy:claude-opus-4-6-thinking
      - pi:cursor/claude-opus-5@1m
  frontend-critic:
    prefer:
      - agy:gemini-3.1-pro-high              # alias: gemini-pro
      - agy:gemini-3.7-flash-high            # alias: gemini-ui
      - agy:claude-sonnet-4-6
  debugger:
    prefer:
      - pi:hyper/deepseek-v4-pro
      - agy:claude-sonnet-4-6
  spam-worker:
    prefer:
      - pi:yolo-auto/qwen3.8-27b             # owner-approved spam lane
